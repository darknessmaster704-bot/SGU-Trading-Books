<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - SGU</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="dark-mode-toggle">
    <label class="toggle-switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="toggle-slider">
        <i class="fa-solid fa-sun"></i>
        <i class="fa-solid fa-moon"></i>
      </span>
    </label>
  </div>

  <header class="nav-bar">
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="upload.html">Upload</a></li>
    </ul>
    <div class="nav-btns"></div>
  </header>

  <main>
    <div class="contact-container">
      <h1><i class="fa-solid fa-envelope"></i> Contact Us</h1>
      <p>Have a question or want to contribute? Reach out!</p>

      <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent! (Demo)');">
        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> Name</label>
          <input type="text" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-envelope"></i> Email</label>
          <input type="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-message"></i> Message</label>
          <textarea rows="5" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
      </form>

      <div class="contact-info">
        <div class="info-card">
          <i class="fa-solid fa-location-dot"></i>
          <h3>Location</h3>
          <p>SGU University Campus</p>
        </div>
        <div class="info-card">
          <i class="fa-solid fa-envelope"></i>
          <h3>Email</h3>
          <p>sgu-books@example.com</p>
        </div>
        <div class="info-card">
          <i class="fa-solid fa-users"></i>
          <h3>Community</h3>
          <p>Join our study group!</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SGU Trading Books. Built by students, for students.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>initDarkMode();</script>
</body>
</html>
