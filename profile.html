<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - SGU</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="dark-mode-toggle">
    <label class="toggle-switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="toggle-slider">
        <i class="fa-solid fa-sun"></i>
        <i class="fa-solid fa-moon"></i>
      </span>
    </label>
  </div>

  <header class="nav-bar">
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="upload.html">Upload</a></li>
    </ul>
    <div class="nav-btns"></div>
  </header>

  <main>
    <div class="profile-container">
      <div class="profile-card" id="userInfo">
        <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading profile...</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <i class="fa-solid fa-file"></i>
          <h3 id="statsFiles">0</h3>
          <p>Files Uploaded</p>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-download"></i>
          <h3 id="statsDownloads">0</h3>
          <p>Total Downloads</p>
        </div>
      </div>

      <div class="files-section">
        <h2><i class="fa-solid fa-folder-open"></i> My Uploaded Files</h2>
        <div id="userFiles" class="files-grid">
          <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading your files...</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SGU Trading Books. Built by students, for students.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="profile.js"></script>
  <script>initDarkMode();</script>
</body>
</html>
