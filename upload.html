<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload - SGU</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="dark-mode-toggle">
    <label class="toggle-switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="toggle-slider">
        <i class="fa-solid fa-sun"></i>
        <i class="fa-solid fa-moon"></i>
      </span>
    </label>
  </div>

  <header class="nav-bar">
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="upload.html" class="active">Upload</a></li>
    </ul>
    <div class="nav-btns"></div>
  </header>

  <main>
    <div class="upload-container">
      <h1><i class="fa-solid fa-cloud-arrow-up"></i> Upload File</h1>
      <p>Share your notes, books, or recordings with your classmates!</p>

      <form class="upload-form" id="uploadForm">
        <div class="form-group">
          <label><i class="fa-solid fa-heading"></i> File Title *</label>
          <input type="text" id="fileTitle" placeholder="e.g., Calculus Chapter 3 Notes" required>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-layer-group"></i> Term *</label>
          <select id="fileTerm" required>
            <option value="">Select Term</option>
            <option value="1">1st Term</option>
            <option value="2">2nd Term</option>
            <option value="3">3rd Term</option>
            <option value="4">4th Term</option>
            <option value="5">5th Term</option>
            <option value="6">6th Term</option>
          </select>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-tag"></i> File Type *</label>
          <select id="fileType" required>
            <option value="">Select Type</option>
            <option value="book">Book / E-Book</option>
            <option value="notes">Notes</option>
            <option value="recording">Audio Recording</option>
            <option value="slides">Slides / PPT</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-book-open"></i> Subject *</label>
          <input type="text" id="fileSubject" placeholder="e.g., Mathematics, Physics..." required>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> Author / Professor</label>
          <input type="text" id="fileAuthor" placeholder="e.g., Dr. Smith (optional)">
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-file"></i> Select File *</label>
          <div class="file-drop-zone" id="fileDropZone">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>Click to browse or drag & drop file here</p>
            <p style="font-size:12px;opacity:0.5;margin-top:5px;">PDF, Word, PowerPoint, MP3, MP4 (Max 50MB)</p>
            <input type="file" id="fileInput" style="display:none;" accept=".pdf,.doc,.docx,.ppt,.pptx,.mp3,.mp4,.zip,.rar">
          </div>
          <div id="fileNameDisplay" style="margin-top:10px;font-size:14px;"></div>
        </div>

        <div id="progressContainer" style="display:none;margin-bottom:20px;">
          <div style="background:rgba(255,255,255,0.1);border-radius:10px;height:8px;overflow:hidden;">
            <div id="progressBar" style="background:rgb(78,183,218);height:100%;width:0%;border-radius:10px;transition:width 0.3s;"></div>
          </div>
          <p style="text-align:center;font-size:12px;opacity:0.7;margin-top:5px;">Uploading...</p>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fa-solid fa-check"></i> Upload File
        </button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SGU Trading Books. Built by students, for students.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="upload.js"></script>
  <script>initDarkMode();</script>
</body>
</html>
