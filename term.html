<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Term Files - SGU</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="dark-mode-toggle">
    <label class="toggle-switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="toggle-slider">
        <i class="fa-solid fa-sun"></i>
        <i class="fa-solid fa-moon"></i>
      </span>
    </label>
  </div>

  <header class="nav-bar">
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="upload.html">Upload</a></li>
    </ul>
    <div class="nav-btns"></div>
  </header>

  <main>
    <div class="termss">
      <ul class="termlinks">
        <li><a href="term.html?term=1">1st Term</a></li>
        <li><a href="term.html?term=2">2nd Term</a></li>
        <li><a href="term.html?term=3">3rd Term</a></li>
        <li><a href="term.html?term=4">4th Term</a></li>
        <li><a href="term.html?term=5">5th Term</a></li>
        <li><a href="term.html?term=6">6th Term</a></li>
      </ul>
    </div>

    <div class="hero">
      <h1 id="termTitle">Term Files</h1>
      <p>Browse all materials for this term</p>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="termSearch" placeholder="Search in this term...">
    </div>

    <div class="files-section">
      <div id="termFilesList" class="files-grid"></div>
      <div id="noResults" class="no-results" style="display:none;">
        <i class="fa-solid fa-face-frown"></i>
        <p>No files found in this term yet.</p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SGU Trading Books. Built by students, for students.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    initDarkMode();
    const urlParams = new URLSearchParams(window.location.search);
    const termNumber = urlParams.get('term') || '1';
    const termNames = ['', '1st', '2nd', '3rd', '4th', '5th', '6th'];
    document.getElementById('termTitle').textContent = termNames[parseInt(termNumber)] + ' Term Files';
    loadFiles('termFilesList', 'termSearch', termNumber);
  </script>
</body>
</html>
